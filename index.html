<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tiltômetro</title>
</head>
<body>
    <main class="main-container">
        <header class="header-section">
            <h1>Tiltômetro</h1>
            <hr>
        </header>

        <section class="dashboard">
            <div class="gauge-wrapper">
                <div class="emoji-overlay">
                    <span class="emoji" style="--angle: -75deg">😁</span>
                    <span class="emoji" style="--angle: -45deg">😄</span>
                    <span class="emoji" style="--angle: -13deg">🙂</span>
                    <span class="emoji" style="--angle: 18deg">😐</span>
                    <span class="emoji" style="--angle: 48deg">😟</span>
                    <span class="emoji" style="--angle: 76deg">😡</span>
                </div>

                <div class="gauge-frame">
                    <div class="gauge-arc"></div>
                    <div class="needle" id="needle"></div>
                    <div class="gauge-markers">
                        <span class="mark-low">LOW</span>
                        <span class="mark-high">HIGH</span>
                    </div>
                </div>

                <h2 class="gauge-title">STRESS LEVEL</h2>

                <div class="gauge-actions">
                    <button class="ctrl-btn" onclick="adjustLevel(-15)">- </button>
                    <button class="ctrl-btn" onclick="adjustLevel(15)">+ </button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
